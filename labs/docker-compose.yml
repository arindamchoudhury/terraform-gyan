# Free local AWS emulator for the book's 🧪 Labs (Ch2 / B2 onward).
# Floci — MIT, no account, no auth token. Serves the LocalStack API on :4566,
# so `tflocal` drives it directly.
#
#   Start:   docker compose -f labs/docker-compose.yml up -d
#   Health:  curl -s http://localhost:4566/_floci/health
#   Console: http://localhost:4500   (starts with the emulator, see floci-ui below)
#   Stop:    docker compose -f labs/docker-compose.yml down
#
# Swap the image for a different free emulator without changing anything else:
#   ministackorg/ministack           # MiniStack (MIT, no token)
#   localstack/localstack:stable      # LocalStack (needs LOCALSTACK_AUTH_TOKEN)
services:
  floci:
    # Pinned, not :latest — the book's labs publish measured command output,
    # and a floating tag makes those numbers unreproducible. Bump deliberately.
    image: floci/floci:1.6.0
    container_name: floci-lab
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      # Lets the emulator spin up real containers for RDS / ECS / Lambda.
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    restart: unless-stopped
    # IAM authorization enforcement is OFF by default, which is what the
    # hello-world labs want (their throwaway `test` creds must never be denied).
    # For the IAM chapter only, uncomment the block below and recreate the
    # container (`docker compose -f labs/docker-compose.yml up -d --force-recreate`).
    # Floci then evaluates attached policies: an explicit Deny, an implicit
    # default-deny, and denials on iam:* actions all take effect. The root/seed
    # key `test` still bypasses enforcement, so lab setup steps keep working.
    # environment:
    #   FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "true"

  # Web console — see what your labs create at http://localhost:4500.
  # Starts alongside the emulator on a plain `up -d`. Don't want it? Comment
  # this service out, or add `profiles: ["ui"]` to make it opt-in.
  # All-in-one image: one process serves the frontend + its API on :4500 and
  # reads the emulator over the compose network via FLOCI_ENDPOINT.
  floci-ui:
    image: floci/floci-ui:0.2.0
    container_name: floci-ui
    ports:
      - "127.0.0.1:4500:4500"
    environment:
      FLOCI_ENDPOINT: http://floci:4566     # emulator, by its compose service name
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      - floci
    restart: unless-stopped

  # GCP emulator — Chapter 15's `gcs` backend lab only, so it is behind a
  # profile and does NOT start on a plain `up -d`:
  #
  #   docker compose -f labs/docker-compose.yml --profile gcp up -d
  #
  # Same project as the AWS emulator above (floci-io, MIT), and it ships its own
  # compat-terraform / compat-opentofu suites. Serves the Google JSON API, which
  # is why the AWS emulator cannot stand in for it: the `gcs` backend talks to
  # /storage/v1/b, not to S3.
  floci-gcp:
    image: floci/floci-gcp:latest
    container_name: floci-gcp-lab
    profiles: ["gcp"]
    ports:
      - "127.0.0.1:4588:4588"
    environment:
      FLOCI_GCP_HOSTNAME: localhost
      FLOCI_GCP_BASE_URL: http://localhost:4588
    restart: unless-stopped
