# Self-hosted GitLab CE for the Chapter 15 state-backend labs.
#
# This is the only lab in the book that does not run against the AWS emulator,
# and the only one with a real resource cost. It exists because GitLab-managed
# Terraform state cannot be exercised any other way without a gitlab.com account:
# the feature is the GitLab Rails app implementing the `http` backend protocol.
#
# Sizing comes from GitLab's own memory-constrained guidance, captured in
# docs/sources/gitlab-docs/gitlab-memory-constrained.md. Every setting under
# GITLAB_OMNIBUS_CONFIG below is from that page. Budget ~2.5 GB of RAM for this
# container and 20 GB of disk; the tuned configuration is documented to run in
# 2 GB plus 1 GB of swap.
#
#   docker compose -f labs/chapter15/gitlab/docker-compose.yml up -d
#
# First boot takes several minutes: the image unpacks, then omnibus runs a full
# `gitlab-ctl reconfigure` against settings it has never seen. Watch it with
#   docker logs -f tf-lab-gitlab
# and wait for the container to report healthy before opening the UI.

services:
  gitlab:
    # Pinned rather than :latest, so a lab written today still boots next year.
    # 19.2.4 is the current stable CE line (2026-08-17). CE, not EE: "When memory
    # consumption is the primary concern, install GitLab CE."
    image: gitlab/gitlab-ce:19.2.4-ce.0
    container_name: tf-lab-gitlab
    hostname: gitlab.local
    restart: unless-stopped
    shm_size: '256m'
    ports:
      # Must match the port inside external_url, or every generated link and the
      # git remote will point somewhere the host cannot reach.
      - '8929:8929'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # 127.0.0.1, not localhost. On Windows, localhost resolves to ::1 first and
        # the published IPv6 mapping does not answer, so every generated link and
        # API address in the UI would point somewhere the host cannot reach.
        # Measured 2026-08-19: curl 127.0.0.1:8929 -> 200, localhost:8929 -> empty reply.
        external_url 'http://127.0.0.1:8929'
        nginx['listen_port'] = 8929

        # --- Puma: single process instead of clustered mode.
        # Documented saving: 100-400 MB.
        puma['worker_processes'] = 0
        puma['exporter_enabled'] = false

        # --- Sidekiq: default concurrency is 20.
        sidekiq['concurrency'] = 10
        sidekiq['metrics_enabled'] = false

        # --- Monitoring stack off. Documented saving: ~300 MB.
        alertmanager['enable'] = false
        gitlab_exporter['enable'] = false
        gitlab_kas['enable'] = false
        node_exporter['enable'] = false
        postgres_exporter['enable'] = false
        prometheus['enable'] = false
        prometheus_monitoring['enable'] = false
        redis_exporter['enable'] = false

        # --- Give memory back instead of holding it in jemalloc's caches.
        gitlab_rails['env'] = {
          'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000'
        }

        # --- Gitaly: cap parallelism and apply the same allocator setting.
        gitaly['configuration'] = {
          concurrency: [
            {
              'rpc' => "/gitaly.SmartHTTPService/PostReceivePack",
              'max_per_repo' => 3,
            }, {
              'rpc' => "/gitaly.SSHService/SSHUploadPack",
              'max_per_repo' => 3,
            },
          ],
        }
        gitaly['env'] = {
          'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000',
          'GITALY_COMMAND_SPAWN_MAX_PARALLEL' => '2'
        }
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab

# Named volumes rather than bind mounts. GitLab writes constantly through these
# paths, and a Windows bind mount makes that slow enough to matter.
volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
