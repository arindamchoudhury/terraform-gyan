# Self-hosted GitLab + a CI runner, for the Chapter 15 forge lab.
#
# What this lab shows is NOT "GitLab can store Terraform state". It is the
# arrangement most teams actually run: the repository and the pipeline live on
# the forge, and the state lives in an object store — here the `s3` backend from
# lab 2, against the same AWS emulator.
#
# Both services join the emulator's network (`labs_default`) so a CI job can
# reach the bucket by container name. Start the emulator first:
#
#   docker compose -f labs/docker-compose.yml up -d
#   docker compose -f labs/chapter15/gitlab/docker-compose.yml up -d
#
# First boot takes several minutes. Do not wait for the container to report
# healthy — it says so long before it serves. See README.md.
#
# Sizing comes from GitLab's memory-constrained guidance, captured in
# docs/sources/gitlab-docs/gitlab-memory-constrained.md. Measured here: 2.3 GB
# resident, ~7 minutes to first serve.

services:
  gitlab:
    # Pinned rather than :latest, so a lab written today still boots next year.
    # 19.2.4 is the current stable CE line (2026-08-17). CE, not EE: "When memory
    # consumption is the primary concern, install GitLab CE."
    image: gitlab/gitlab-ce:19.2.4-ce.0
    container_name: tf-lab-gitlab
    hostname: tf-lab-gitlab
    restart: unless-stopped
    shm_size: '256m'
    ports:
      # Must match the port inside external_url, or every generated link and the
      # git remote will point somewhere the host cannot reach.
      - '127.0.0.1:8929:8929'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # 127.0.0.1, not localhost. On Windows, localhost resolves to ::1 first and
        # the published IPv6 mapping does not answer, so every generated link and
        # API address in the UI would point somewhere the host cannot reach.
        # Measured 2026-08-19: curl 127.0.0.1:8929 -> 200, localhost:8929 -> empty reply.
        external_url 'http://127.0.0.1:8929'
        nginx['listen_port'] = 8929

        # --- Puma: single process instead of clustered mode.
        # Documented saving: 100-400 MB.
        puma['worker_processes'] = 0
        puma['exporter_enabled'] = false

        # --- Sidekiq: default concurrency is 20.
        sidekiq['concurrency'] = 10
        sidekiq['metrics_enabled'] = false

        # --- Monitoring stack off. Documented saving: ~300 MB.
        alertmanager['enable'] = false
        gitlab_exporter['enable'] = false
        gitlab_kas['enable'] = false
        node_exporter['enable'] = false
        postgres_exporter['enable'] = false
        prometheus['enable'] = false
        prometheus_monitoring['enable'] = false
        redis_exporter['enable'] = false

        # --- Give memory back instead of holding it in jemalloc's caches.
        gitlab_rails['env'] = {
          'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000'
        }

        # --- Gitaly: cap parallelism and apply the same allocator setting.
        gitaly['configuration'] = {
          concurrency: [
            {
              'rpc' => "/gitaly.SmartHTTPService/PostReceivePack",
              'max_per_repo' => 3,
            }, {
              'rpc' => "/gitaly.SSHService/SSHUploadPack",
              'max_per_repo' => 3,
            },
          ],
        }
        gitaly['env'] = {
          'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000',
          'GITALY_COMMAND_SPAWN_MAX_PARALLEL' => '2'
        }
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab

  # The runner holds no configuration until setup.py registers it. It mounts
  # the Docker socket because it uses the docker executor: each job runs in its
  # own container, which is also how the job reaches the emulator.
  runner:
    # PINNED, and this one is not cosmetic. `gitlab/gitlab-runner:latest` is a
    # pre-release build (measured 2026-08-19: 19.3.0~pre.1819), and the runner
    # derives its helper image tag from its own version — so every job fails in
    # prepare_executor with "manifest for ...gitlab-runner-helper:x86_64-v19.3.0
    # not found". Track the GitLab line instead: 19.2.x here.
    image: gitlab/gitlab-runner:v19.2.2
    container_name: tf-lab-gitlab-runner
    restart: unless-stopped
    depends_on:
      - gitlab
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-config:/etc/gitlab-runner

# Named volumes rather than bind mounts. GitLab writes constantly through these
# paths, and a Windows bind mount makes that slow enough to matter.
volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  runner-config:

# The emulator's network, created by labs/docker-compose.yml. Joining it is what
# lets a CI job resolve `floci-lab:4566`, and lets the runner reach GitLab by
# container name instead of through the host's loopback.
networks:
  default:
    name: labs_default
    external: true
