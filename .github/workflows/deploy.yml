name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress production deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Third-party actions are pinned by commit SHA, not by tag. A tag is
      # mutable, so `@v7` is a promise from whoever controls that repository
      # that they will not repoint it at code which runs with this job's token.
      # The trailing comment is the human-readable version, and is what
      # Dependabot rewrites when it bumps the SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Zensical
        run: pip install zensical tomli-w

      # Published site shows only these top-level nav sections. The committed
      # zensical.toml keeps the full nav for local builds; this trims a copy in
      # the ephemeral CI checkout only (not committed).
      - name: Trim published nav
        run: |
          python - <<'PY'
          import tomllib, tomli_w
          KEEP = {"Learning Path", "Book"}
          with open("zensical.toml", "rb") as f:
              cfg = tomllib.load(f)
          nav = cfg["project"]["nav"]
          cfg["project"]["nav"] = [it for it in nav if next(iter(it)) in KEEP]
          with open("zensical.toml", "wb") as f:
              tomli_w.dump(cfg, f)
          print("Published nav:", [next(iter(it)) for it in cfg["project"]["nav"]])
          PY

      # Not a bare `zensical build`: that leaves [[slug]] references as literal
      # text, since the resolver lives in scripts/wikilinks.py rather than in
      # zensical.toml. build_site.py installs it, so the published pages render
      # links exactly as the local preview does. A slug matching no page renders
      # as plain text and fails the build.
      - name: Build site
        run: python scripts/build_site.py          # outputs ./site

      # include-hidden-files is required to keep v5 behaving like the v3 this
      # replaced. v3 tarred the site excluding only .git and .github; v5 also
      # excludes every dotfile unless this is set. The published site contains
      # three of them — examples/.gitignore and two examples/**/.terraform.lock.hcl
      # — which would have disappeared silently on the version bump.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site
          include-hidden-files: "true"

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
